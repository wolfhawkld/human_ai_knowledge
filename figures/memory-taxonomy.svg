<text x="312.0" y="521.0" text-anchor="middle" font-size="11.5" fill="#475569">事实/概念，不依赖场合</text>
<path d="M 218 420 C 218 444, 312.0 444, 312.0 470" fill="none" stroke="#cbd5e1" stroke-width="1.7"/>
<rect x="416" y="470" width="168" height="68" rx="10" fill="#f0f9ff" stroke="#0891b2" stroke-width="1.8"/>
<text x="500.0" y="501.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">程序性记忆</text>
<text x="500.0" y="521.0" text-anchor="middle" font-size="11.5" fill="#475569">技能与习惯</text>
<path d="M 688 420 C 688 444, 500.0 444, 500.0 470" fill="none" stroke="#cbd5e1" stroke-width="1.7"/>
<rect x="604" y="470" width="168" height="68" rx="10" fill="#f0f9ff" stroke="#0891b2" stroke-width="1.8"/>
<text x="688.0" y="501.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">启动效应</text>
<text x="688.0" y="521.0" text-anchor="middle" font-size="11.5" fill="#475569">无意识的影响</text>
<path d="M 688 420 C 688 444, 688.0 444, 688.0 470" fill="none" stroke="#cbd5e1" stroke-width="1.7"/>
<rect x="792" y="470" width="168" height="68" rx="10" fill="#f0f9ff" stroke="#0891b2" stroke-width="1.8"/>
<text x="876.0" y="501.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">条件反射类</text>
<text x="876.0" y="521.0" text-anchor="middle" font-size="11.5" fill="#475569">如情绪性条件作用</text>
<path d="M 688 420 C 688 444, 876.0 444, 876.0 470" fill="none" stroke="#cbd5e1" stroke-width="1.7"/>
