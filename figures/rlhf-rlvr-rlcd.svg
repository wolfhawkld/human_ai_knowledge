<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" width="1080" height="660" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">
<rect width="1080" height="660" fill="#ffffff"/>
<text x="540.0" y="34" text-anchor="middle" font-size="18.5" font-weight="700" fill="#1e1b4b">RLHF / RLVR / RLCD：奖励信号从哪来，决定了它能用在哪</text>
<text x="195.0" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">RLHF · 人类反馈</text>
<text x="540.0" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#0891b2">RLVR · 可验证奖励</text>
<text x="885.0" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">RLCD · 校准决策</text>
<rect x="27" y="84" width="1026" height="108" rx="12" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.3"/>
<text x="60" y="118" font-size="11.5" fill="#94a3b8">谁在打分</text>
<text x="45" y="118" font-size="12" fill="#334155">人类</text>
<text x="390" y="118" font-size="12" fill="#334155">验证器</text>
<text x="735" y="118" font-size="12" fill="#334155">结果分布</text>
<text x="60" y="144" font-size="11.5" fill="#94a3b8">它在说什么</text>
<text x="45" y="144" font-size="12" fill="#334155">「这个回答更好」</text>
<text x="390" y="144" font-size="12" fill="#334155">「这个答案是对的」</text>
<text x="735" y="144" font-size="12" fill="#334155">「你的 80% 应对应约 80% 正确率」</text>
<text x="60" y="170" font-size="11.5" fill="#94a3b8">前提</text>
<text x="45" y="170" font-size="12" fill="#334155">需要训练奖励模型（RM）</text>
<text x="390" y="170" font-size="12" fill="#334155">无需 RM，可无限次调用</text>
<text x="735" y="170" font-size="12" fill="#334155">奖励函数与训练方法均未公开</text>
<line x1="45" y1="212" x2="1035" y2="212" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="45" y="244" font-size="12.5" font-weight="700" fill="#be123c">奖励越客观 → 可自动化程度越高 → 但能覆盖的任务范围越窄（三者互补，不是替代）</text>
<rect x="45" y="276" width="300" height="74" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.7"/>
<text x="195.0" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">开放域主观质量</text>
<text x="195.0" y="328" text-anchor="middle" font-size="11.5" fill="#475569">对话 · 写作 · 安全 · 语气</text>
<rect x="390" y="276" width="300" height="74" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.7"/>
<text x="540.0" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">有可程序化验证的真值</text>
<text x="540.0" y="328" text-anchor="middle" font-size="11.5" fill="#475569">数学 · 代码 · 形式化推理</text>
<rect x="735" y="276" width="300" height="74" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/>
<text x="885.0" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">有界决策 + 需置信度</text>
<text x="885.0" y="328" text-anchor="middle" font-size="11.5" fill="#475569">分类 · 路由 · 打分 · 抽取</text>
<line x1="351" y1="313.0" x2="384" y2="313.0" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>
<line x1="696" y1="313.0" x2="729" y2="313.0" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#cbd5e1"/></marker></defs>
<rect x="45" y="396" width="990" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
<text x="66" y="426" font-size="13.5" font-weight="700" fill="#c2410c">⚠ 但 RLVR 不等于「模型变聪明了」</text>
<text x="66" y="454" font-size="12" fill="#7c2d12">NeurIPS 2025（arXiv 2504.13837）用 pass@k 系统性检验了这个假设，结论是：</text>
<text x="66" y="477" font-size="12" fill="#7c2d12">· RL 微调提升的是【采样效率】，没有扩展 base model 已有的推理能力上限</text>
<text x="66" y="500" font-size="12" fill="#7c2d12">· 低 k（pass@1）RL 强，但 k 增大（pass@256）时【base model 稳定反超】</text>
<text x="66" y="523" font-size="12" fill="#7c2d12">· RL 收窄了探索：被奖励的轨迹被放大，但解空间整体收缩——在 base 分布【之内】优化</text>
<text x="66" y="546" font-size="12" fill="#7c2d12">· PPO / GRPO / Reinforce++ 表现接近且都到顶，远未达到蒸馏的采样效率</text>
<text x="45" y="586" font-size="12" fill="#334155">同名的坑：ICLR 2024 的 RLCD 是 Reinforcement Learning from Contrastive Distillation，与本文的 Calibrated Decisions 无关。</text>
<text x="45" y="610" font-size="12" fill="#334155">校准是群体属性：说 80% 的那批预测里应约 80% 正确 —— 单个答案仍可能错。</text>
</svg>