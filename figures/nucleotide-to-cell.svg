<text x="362" y="377" font-size="12.5" fill="#b45309" text-anchor="middle" font-weight="700">基因不是「一个东西」，是 DNA 上的一段 —— 与 DNA 是「章 : 书」的关系</text>
<rect x="30" y="360" width="1160" height="236" rx="14" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="610.0" y="390" font-size="15" fill="#4c1d95" text-anchor="middle" font-weight="700">连起来就是中心法则：信息沿一条主线流动</text>
<text x="610.0" y="412" font-size="11.5" fill="#7c3aed" text-anchor="middle">genome.gov：genetic information flows only in one direction, from DNA, to RNA, to protein</text>
<rect x="152" y="456" width="168" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="236.0" y="478" font-size="14" fill="#3730a3" text-anchor="middle" font-weight="700">基因 / DNA</text>
<text x="236.0" y="492" font-size="10.5" fill="#7c3aed" text-anchor="middle">（信息储存在这里）</text>
<rect x="438" y="456" width="150" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="513.0" y="478" font-size="14" fill="#3730a3" text-anchor="middle" font-weight="700">RNA</text>
<text x="513.0" y="492" font-size="10.5" fill="#7c3aed" text-anchor="middle">（临时拷贝：T→U）</text>
<rect x="726" y="456" width="168" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="810.0" y="478" font-size="14" fill="#3730a3" text-anchor="middle" font-weight="700">蛋白质</text>
<text x="810.0" y="492" font-size="10.5" fill="#7c3aed" text-anchor="middle">（折叠成有功能的形状）</text>
