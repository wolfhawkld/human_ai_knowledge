<rect width="1220" height="760" fill="#fff"/>
<text x="610.0" y="34" font-size="18" fill="#1e1b4b" text-anchor="middle" font-weight="700">七个概念：各自在哪一层，以及它们怎么连起来</text>
<text x="610.0" y="58" font-size="12.5" fill="#64748b" text-anchor="middle">它们不是并列关系 —— 有的在单体层，有的在聚合物层，有的根本不是「东西」而是「一段」</text>
