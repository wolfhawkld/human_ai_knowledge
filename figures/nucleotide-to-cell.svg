<text x="82.0" y="268" font-size="14.5" fill="#1e1b4b" text-anchor="middle" font-weight="700">机器</text>
<text x="82.0" y="284" font-size="10.5" fill="#94a3b8" text-anchor="middle">读信息的装置</text>
