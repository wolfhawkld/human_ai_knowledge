<line x1="590" y1="476.0" x2="724" y2="476.0" stroke="#6d28d9" stroke-width="2" marker-end="url(#a)"/>
<text x="379" y="446" font-size="12.5" fill="#6d28d9" text-anchor="middle" font-weight="700">转录</text>
<text x="657" y="446" font-size="12.5" fill="#6d28d9" text-anchor="middle" font-weight="700">翻译</text>
<text x="657" y="512" font-size="11.5" fill="#be185d" text-anchor="middle">核糖体在这里工作（rRNA + 蛋白质，本身是核酶）</text>
<rect x="152" y="546" width="700" height="36" rx="9" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
<text x="502" y="570" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">3 个核苷酸 = 1 个密码子 = 1 个氨基酸　→　4³ = 64 个密码子（其中 3 个是终止密码子）</text>
<rect x="30.0" y="620" width="279.5" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="169.75" y="646" font-size="14.5" fill="#1e1b4b" text-anchor="middle" font-weight="700">4 种碱基</text>
<text x="169.75" y="666" font-size="10.8" fill="#64748b" text-anchor="middle">A / T / C / G（DNA）　A / U / C / G（RNA）</text>
<rect x="323.5" y="620" width="279.5" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="463.25" y="646" font-size="14.5" fill="#1e1b4b" text-anchor="middle" font-weight="700">20 种</text>
<text x="463.25" y="666" font-size="10.8" fill="#64748b" text-anchor="middle">构成天然蛋白质的标准氨基酸</text>
<rect x="617.0" y="620" width="279.5" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="756.75" y="646" font-size="14.5" fill="#1e1b4b" text-anchor="middle" font-weight="700">64 → 20</text>
<text x="756.75" y="666" font-size="10.8" fill="#64748b" text-anchor="middle">密码子冗余但不含糊（简并性）</text>
<rect x="910.5" y="620" width="279.5" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="1050.25" y="646" font-size="14.5" fill="#1e1b4b" text-anchor="middle" font-weight="700">2 种糖</text>
<text x="1050.25" y="666" font-size="10.8" fill="#64748b" text-anchor="middle">核糖（RNA）／脱氧核糖（DNA）</text>
