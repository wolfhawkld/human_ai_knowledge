<text x="100" y="259" text-anchor="end" font-size="11" fill="#64748b">Layer 21</text>
<text x="100" y="268" text-anchor="end" font-size="11" fill="#64748b">Layer 20</text>
<text x="100" y="439" text-anchor="end" font-size="11" fill="#64748b">Layer 1</text>
<line x1="110" y1="264.0" x2="378" y2="264.0" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="386" y="268.0" font-size="12" font-weight="700" fill="#e11d48">L/2 分界</text>
<text x="185.0" y="174.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">DECODER × 20</text>
<text x="185.0" y="354.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CAUSAL ENCODER × 20</text>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#0891b2"/></marker></defs>
<path d="M 260 264.0 C 306 264.0, 306 169.5, 260 169.5" fill="none" stroke="#0891b2" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="312" y="202.0" font-size="12" font-weight="700" fill="#0891b2">H(L/2) 投影</text>
<text x="312" y="221.0" font-size="11" font-weight="400" fill="#0e7490">C_l = H(L/2)·W^KV_l</text>
<text x="312" y="240.0" font-size="11" font-weight="400" fill="#0e7490">Z_l = H(L/2)·W^Z_l</text>
<rect x="520" y="84" width="440" height="94" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.6"/>
<text x="536" y="108" font-size="13.5" font-weight="700" fill="#7c3aed">Prefill（读输入）— 只跑 encoder</text>
<text x="536" y="130" font-size="12" fill="#334155">• 每个 token 只穿过前 20 层 → 激活 8B 参数/token</text>
<text x="536" y="150" font-size="12" fill="#334155">• decoder 的 global KV 由 H(20) 一次性投影得到</text>
<text x="536" y="170" font-size="12" fill="#334155">• 大部分 prompt token 绕过 decoder 全部计算</text>
<rect x="520" y="192" width="440" height="94" rx="10" fill="#f8fafc" stroke="#4338ca" stroke-width="1.6"/>
<text x="536" y="216" font-size="13.5" font-weight="700" fill="#4338ca">Decode（写输出）— 跑 decoder</text>
<text x="536" y="238" font-size="12" fill="#334155">• 后 20 层逐 token 自回归 → 激活 16B 参数/token</text>
<text x="536" y="258" font-size="12" fill="#334155">• 读取共享 global KV + 层内 SWA KV 产出注意力</text>
<text x="536" y="278" font-size="12" fill="#334155">• 解码侧参数量更大（生成对能力要求更高）</text>
<rect x="520" y="300" width="440" height="94" rx="10" fill="#f8fafc" stroke="#e11d48" stroke-width="1.6"/>
<text x="536" y="324" font-size="13.5" font-weight="700" fill="#e11d48">SWA 是例外：不走投影捷径</text>
<text x="536" y="346" font-size="12" fill="#334155">• global attention 走投影；local SWA 仍逐层用自己的 H_l</text>
<text x="536" y="366" font-size="12" fill="#334155">• 目的：保证 local KV 的计算深度（局部细节逐层精细化）</text>
<text x="536" y="386" font-size="12" fill="#334155">• 代价：需 SWA replay → Bounded Replay 只重放最后 n_win 个 token</text>
<text x="520" y="424" font-size="12" fill="#64748b">复杂度：O(N·L)  →  O(N·L/2 + n_win·L/2)  ≈  O(N·L/2)　(N ≫ n_win)</text>
</svg>